<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل سؤالك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#edf1f5;--ink:#15202b;--blue:#1b4dff;--muted:#5b6b7b;--line:#c9d3de;--white:#fff;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.7;padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:2rem;line-height:1.3;margin:12px 0 6px;font-weight:700}
p.lead{margin:0 0 22px;color:var(--muted)}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea,input{width:100%;font:inherit;color:inherit;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:150px;resize:vertical;font-size:1.15rem}
textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-color:var(--blue)}
.count{text-align:left;color:var(--muted);font-size:.9rem;margin-top:4px}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:1.15rem;color:#fff;background:var(--blue);border:0;border-radius:10px;padding:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;font-weight:600}
.err{color:var(--err)}
#done{display:none;margin-top:30px;background:var(--white);border:2px solid var(--blue);border-radius:12px;padding:22px}
#done h2{margin:0 0 6px;font-size:1.4rem}
#done button{background:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>اكتب سؤالك</h1>
  <p class="lead">سؤالك رح يظهر على الشاشة مباشرة.</p>

  <form id="form" novalidate>
    <label for="text">السؤال</label>
    <textarea id="text" maxlength="300" placeholder="اكتب سؤالك هون" required></textarea>
    <div class="count"><span id="n">0</span> / 300</div>

    <label for="name">اسمك (اختياري)</label>
    <input id="name" maxlength="40" autocomplete="off" placeholder="اتركه فاضي لو بتفضل تبقى مجهول">

    <button id="send" type="submit">أرسل السؤال</button>
    <div id="err" class="msg err" role="alert"></div>
  </form>

  <section id="done" aria-live="polite">
    <h2>وصل سؤالك</h2>
    <p>شوفه على الشاشة. بتقدر تسأل سؤال ثاني.</p>
    <button id="again" type="button">اكتب سؤال ثاني</button>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const text=$('text'), form=$('form'), done=$('done');
text.addEventListener('input',()=>$('n').textContent=text.value.length);
$('name').value=localStorage.getItem('qa_name')||'';
form.addEventListener('submit',async e=>{
  e.preventDefault();
  $('err').textContent='';
  if(text.value.trim().length<2){$('err').textContent='اكتب سؤالك أولاً';text.focus();return}
  $('send').disabled=true;
  try{
    const r=await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,name:$('name').value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'صار خطأ، جرّب مرة ثانية');
    localStorage.setItem('qa_name',$('name').value);
    text.value='';$('n').textContent='0';
    form.style.display='none';done.style.display='block';
  }catch(x){$('err').textContent=x.message}
  $('send').disabled=false;
});
$('again').addEventListener('click',()=>{done.style.display='none';form.style.display='block';text.focus()});
</script>
</body>
</html>
