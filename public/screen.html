<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأسئلة المباشرة</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#edf1f5;--ink:#15202b;--blue:#1b4dff;--muted:#5b6b7b;--line:#c9d3de;--white:#fff;--yellow:#ffc93c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.wrap{height:100%;display:grid;grid-template-columns:1fr minmax(240px,22vw);gap:2.2vw;padding:2.2vw}
.main{display:flex;flex-direction:column;gap:1.6vw;min-width:0;min-height:0}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:3vw 3.2vw;display:flex;flex-direction:column;justify-content:center;min-height:36vh;position:relative}
.hero .q{font-size:clamp(1.8rem,4.2vw,4.6rem);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.hero .who{margin-top:1.2vw;font-size:clamp(1rem,1.6vw,1.6rem);opacity:.85}
.hero.empty{background:var(--white);color:var(--muted);border:2px dashed var(--line)}
.hero.empty .q{font-size:clamp(1.5rem,3vw,3rem);font-weight:600}
.list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.2vw;align-content:start}
.item{background:var(--white);border-radius:12px;padding:1.2vw 1.4vw;border-right:6px solid var(--line)}
.item.fresh{border-right-color:var(--yellow)}
.item .t{font-size:clamp(1.1rem,1.7vw,1.8rem);font-weight:600;overflow-wrap:anywhere}
.item .m{margin-top:.4vw;color:var(--muted);font-size:clamp(.85rem,1.1vw,1.1rem)}
aside{background:var(--white);border-radius:18px;padding:1.6vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vw;text-align:center}
aside img{width:100%;max-width:340px;height:auto}
aside .cta{font-size:clamp(1.2rem,2vw,2.2rem);font-weight:700;line-height:1.3}
aside .url{direction:ltr;color:var(--muted);font-size:clamp(.8rem,1vw,1.05rem);overflow-wrap:anywhere}
.count{color:var(--muted);font-size:clamp(.9rem,1.2vw,1.2rem)}
.adm{display:inline-flex;gap:8px;margin-inline-start:12px}
.adm button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.hero .adm button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.5)}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media(max-width:800px){.wrap{grid-template-columns:1fr;height:auto}aside{order:-1;flex-direction:row}aside img{max-width:130px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <section id="hero" class="hero empty"><div class="q">ما وصل أي سؤال بعد. امسح الرمز واكتب سؤالك.</div></section>
    <div class="count" id="count"></div>
    <section id="list" class="list" aria-live="polite"></section>
  </div>
  <aside>
    <div class="cta">امسح الرمز واسأل</div>
    <img src="/qr.svg" alt="رمز QR لصفحة إرسال الأسئلة">
    <div class="url" id="url"></div>
  </aside>
</div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';
const $=id=>document.getElementById(id);
let state={questions:[],featured:null}, seen=new Set(), first=true;

fetch('/api/info').then(r=>r.json()).then(d=>$('url').textContent=d.url.replace(/^https?:\/\//,''));

function api(path,method,body){
  return fetch(path,{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined});
}
function btn(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b}
function adminBox(...btns){if(!key)return null;const s=document.createElement('span');s.className='adm';btns.forEach(b=>s.appendChild(b));return s}
function who(q){const t=new Date(q.ts).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});return (q.name?q.name+' — ':'')+t}

function render(){
  const qs=[...state.questions].sort((a,b)=>b.ts-a.ts);
  const hero=$('hero'), list=$('list');
  const main=qs.find(q=>q.id===state.featured)||qs[0];
  hero.innerHTML='';
  if(!main){hero.className='hero empty';hero.innerHTML='<div class="q">ما وصل أي سؤال بعد. امسح الرمز واكتب سؤالك.</div>'}
  else{
    hero.className='hero';
    const q=document.createElement('div');q.className='q';q.textContent=main.text;
    const w=document.createElement('div');w.className='who';w.textContent=who(main);
    const a=adminBox(...(state.featured?[btn('إلغاء التثبيت',()=>api('/api/feature','POST',{id:null}))]:[]),btn('حذف',()=>api('/api/questions/'+main.id,'DELETE')));
    if(a)w.appendChild(a);
    hero.append(q,w);
  }
  $('count').textContent=qs.length?('عدد الأسئلة: '+qs.length):'';
  list.innerHTML='';
  qs.filter(q=>!main||q.id!==main.id).forEach(q=>{
    const d=document.createElement('div');d.className='item'+((!first&&!seen.has(q.id))?' fresh':'');
    const t=document.createElement('div');t.className='t';t.textContent=q.text;
    const m=document.createElement('div');m.className='m';m.textContent=who(q);
    const a=adminBox(btn('اعرضه كبير',()=>api('/api/feature','POST',{id:q.id})),btn('حذف',()=>api('/api/questions/'+q.id,'DELETE')));
    if(a)m.appendChild(a);
    d.append(t,m);list.appendChild(d);
  });
  qs.forEach(q=>seen.add(q.id));first=false;
}

const es=new EventSource('/events');
es.onmessage=e=>{state=JSON.parse(e.data);render()};
</script>
</body>
</html>
